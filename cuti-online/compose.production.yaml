x-laravel-database: &laravel-database
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:?Atur POSTGRES_DB pada .env.production}
  DB_USERNAME: ${POSTGRES_USER:?Atur POSTGRES_USER pada .env.production}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Atur POSTGRES_PASSWORD pada .env.production}

services:
  init:
    image: cuti-online-app:latest
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment: *laravel-database
    user: "0:0"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/shared-public
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p \
          storage/app/private \
          storage/app/public \
          storage/framework/cache \
          storage/framework/sessions \
          storage/framework/views \
          storage/logs
        chown -R www-data:www-data storage
        php artisan migrate --force
        cp -a public/. /shared-public/

  app:
    build:
      context: .
      target: production
    image: cuti-online-app:latest
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment: *laravel-database
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - app_storage:/var/www/html/storage

  worker:
    image: cuti-online-app:latest
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment: *laravel-database
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - app_storage:/var/www/html/storage

  scheduler:
    image: cuti-online-app:latest
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment: *laravel-database
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - app_storage:/var/www/html/storage

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro

volumes:
  app_public:
  app_storage:
